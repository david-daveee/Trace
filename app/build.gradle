plugins { id 'com.android.application' }
android {
    namespace 'com.podhod.app'
    compileSdk 35
    defaultConfig { applicationId 'com.podhod.app'; minSdk 26; targetSdk 35; versionCode 37; versionName '0.20.1'; testInstrumentationRunner (providers.gradleProperty('smokeRunner').getOrElse('design') == 'notice' ? 'com.podhod.app.NoticeSmoke' : providers.gradleProperty('smokeRunner').getOrElse('design') == 'progress' ? 'com.podhod.app.LibraryProgressSmoke' : providers.gradleProperty('smokeRunner').getOrElse('design') == 'language' ? 'com.podhod.app.LanguageSmoke' : 'com.podhod.app.DesignSmoke') }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'net.sourceforge.jexcelapi:jxl:2.6.12'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
